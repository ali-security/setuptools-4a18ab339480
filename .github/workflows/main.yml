name: tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest -k expression"
        required: false
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Upstream's `pypy3` was PyPy 3.7 in 2021. The runners' PyPy 3.7 image
        # ships a pip (22.0.4) that no longer imports under PyPy
        # (`ImportError: cannot import name 'InvalidSchemeCombination'`), so
        # `python -m pip` is dead before the job starts; pypy3.9 is the oldest
        # PyPy the runners still provision with a working pip.
        python: ["3.6", "3.8", "3.9", "pypy3.9"]
        platform: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # No runner image provisions these interpreters any more, so each has
          # to be compiled from source in-job: arm64 macOS has no prebuilt
          # CPython below 3.10, and the Windows image has no CPython 3.6. Three
          # such legs push the matrix past the build window, so the OSes keep
          # the versions their runners still ship. Every Python upstream tests
          # still runs, on ubuntu-latest.
          - platform: macos-latest
            python: "3.6"
          - platform: macos-latest
            python: "3.8"
          - platform: windows-latest
            python: "3.6"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    env:
      # Registry time machine: resolve the dependency versions that existed at
      # the 52.0.0 release. tox 3 passes PIP_INDEX_URL through to the testenv
      # by default, so the era-correct pytest/flake8/black stack is installed.
      PIP_INDEX_URL: https://:2021-01-25@time-machines-pypi.sealsecurity.io/
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        # MatteoH2O1999/setup-python builds the interpreter from source when no
        # prebuilt exists: 3.6 and pypy-3.7 are past end-of-life and are not
        # provisionable by actions/setup-python on today's ubuntu-24.04 or
        # arm64 macOS runners.
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
          cache-build: true
          allow-build: allow
      - name: Install tox
        run: |
          python -m pip install "tox<4"
      - name: Run tests
        # `tox` runs [testenv] `pytest {posargs}`, so a filter only reaches
        # pytest after `--`; a bare `tox -k ...` would be parsed by tox itself.
        # Empty input keeps upstream's verbatim full-suite command.
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            tox -- -k "${{ inputs.test-filter }}"
          else
            tox
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_INDEX_URL: https://:2021-01-25@time-machines-pypi.sealsecurity.io/
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install build tooling
        run: python -m pip install build path
      - name: Build distributions
        # Upstream's own release recipe, verbatim from tox.ini [testenv:release]
        # minus the twine/GitHub/Tidelift publish steps.
        run: |
          python -m bootstrap
          python -c "import path; path.Path('dist').rmtree_p()"
          # unset tag_build and tag_date pypa/setuptools#2500
          python setup.py egg_info -Db "" saveopts
          python -m build
      - name: Show built distributions
        run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    needs: test
    # Permanently disabled on the fork: publishing needs PyPI/Tidelift secrets.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v2
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - name: Install tox
        run: |
          python -m pip install tox
      - name: Release
        run: tox -e release
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIDELIFT_TOKEN: ${{ secrets.TIDELIFT_TOKEN }}
