name: automerge
# Automerge is an upstream-repo convenience that needs a GITHUB_TOKEN with write
# access; on the build fork it would only fire unbidden on every sync push.
on:
  workflow_dispatch: {}
jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: automerge
        uses: "pascalgn/automerge-action@v0.12.0"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
